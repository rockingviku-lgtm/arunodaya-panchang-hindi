<body><main style="max-width:1000px;margin:0 auto;padding:18px 14px 40px"><header style="margin:8px 0 20px"><a href="/" style="color:#f5bf43;text-decoration:none">← मुख्य पंचांग</a><h1 style="margin:12px 0 4px">उदय लग्न</h1><p style="color:#9ba9c2;margin:0">स्थान और तारीख के अनुसार लग्न समय</p></header>
<section style="background:#111d32;border:1px solid #263550;border-radius:16px;padding:16px;margin-bottom:18px"><label for="daily-city" style="display:block;margin-bottom:6px">शहर / स्थान</label><input id="daily-city" value="Lucknow, India" placeholder="जैसे Lucknow, India" style="width:100%;padding:12px;border-radius:10px;border:1px solid #40516d;background:#0a1121;color:#edf2ff;margin-bottom:12px"><label for="lagna-date" style="display:block;margin-bottom:6px">तारीख</label><input id="lagna-date" type="date" style="width:100%;padding:12px;border-radius:10px;border:1px solid #40516d;background:#0a1121;color:#edf2ff;margin-bottom:12px"><div style="display:flex;gap:10px;flex-wrap:wrap"><button id="show-lagna" style="padding:11px 16px;border:0;border-radius:10px;background:#f5bf43;color:#10192f;font-weight:700">लग्न निकालें</button><button id="use-location" style="padding:11px 16px;border:1px solid #40516d;border-radius:10px;background:#15233b;color:#edf2ff">मेरी लोकेशन इस्तेमाल करें</button></div><small id="location-status" style="display:block;color:#9ba9c2;margin-top:10px">डिफ़ॉल्ट स्थान Lucknow है। लोकेशन अनुमति देने पर निकटतम उपलब्ध स्थान खोजने की कोशिश होगी।</small></section><div id="daily-overview"></div><footer style="color:#9ba9c2;font-size:12px;margin-top:20px">गणना Swiss Ephemeris और Lahiri अयनांश पर आधारित है। अलग पंचांगों में गणना-पद्धति के कारण कुछ अंतर संभव है।</footer></main><script type="module" src="/src/lagna-page.js"></script></body></html>
